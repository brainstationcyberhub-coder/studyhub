
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Study Hub</title>
    <link rel="icon" type="image/png" href="/images/logo.png">
    </head>
    <style>
        @import url('styles/main.css');
    </style>
<body>

    <form action="welcome.html" method="post">
        <fieldset>
            <legend>Welcome Back!</legend>
            <div id="logo">
                <img src="images/logo.png" alt="Study Hub Logo">
            </div>

            <label for="name">Your ID</label><br>
            <input type="text"
                   id="name"
                   name="name"
                   placeholder="Enter your ID"
                   required
                   maxlength="25"><br>

            <label for="pwd">Password</label><br>
            <input type="password"
                   id="pwd"
                   name="pwd"
                   placeholder="Enter your password"
                   required
                   minlength="6">
            <span class="remember-me"
                 style="color: aliceblue; font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; font-size: 15px; font-weight: bold;">Remember me</span>
            <input type="checkbox" name="remember" value="remember"><br>
            <input type="submit" value="Login to Study Hub">
        </fieldset>
    </form>

</body>
</html>
